name: Release

# Pack and publish the Proxeno.Kiln NuGet package on version tags (v*).
# Feed: nuget.org (public) via Trusted Publishing (OIDC) — NO stored API key.
# Prereq: a Trusted Publishing policy on nuget.org (Repository Owner: Proxeno,
# Repository: kiln, Workflow File: release.yml). No repo secrets required —
# `user: retrotom` is the nuget.org profile name (public, not a credential).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # mint the GitHub OIDC token nuget.org exchanges for a short-lived key

jobs:
  pack-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer derives the package version from the tag
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release src/Kiln/Kiln.csproj
        env:
          CI: "true"
      - name: Test (quick gate on tag)
        run: dotnet test -c Release tests/Kiln.Tests/Kiln.Tests.csproj
      - name: Pack
        run: dotnet pack -c Release --no-build src/Kiln/Kiln.csproj -o artifacts/pkg
        env:
          CI: "true"
      # Exchange the GitHub OIDC token for a short-lived nuget.org API key (~1h).
      # Request it immediately before the push so it can't expire first.
      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: retrotom
      - name: Push to nuget.org
        # Push both the package and its symbol package. The previous *.nupkg glob
        # never matched .snupkg, so symbols were silently dropped.
        run: |
          for f in artifacts/pkg/*.nupkg artifacts/pkg/*.snupkg; do
            dotnet nuget push "$f" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done
